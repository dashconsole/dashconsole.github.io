<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DashConsole</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #0f141c; color: #e6edf3; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { margin-bottom: 20px; font-size: 1.6rem; color: #58a6ff; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 18px; margin-bottom: 20px; }
    .card h2 { font-size: 1.1rem; margin-bottom: 12px; color: #f0883e; }
    .sun-data { font-size: 1.15rem; font-weight: bold; }
    .cmd-group { margin-bottom: 12px; }
    .cmd-title { font-size: 0.9rem; color: #8b949e; margin-bottom: 4px; }
    pre { background: #0d1117; border: 1px solid #21262d; border-radius: 6px; padding: 10px 14px; color: #7ee787; font-family: Consolas, monospace; overflow-x: auto; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ DashConsole</h1>

    <div class="card">
      <h2>☀️ Saulės laikas</h2>
      <div id="sun" class="sun-data">Kraunama...</div>
    </div>

    <div class="card">
      <h2>💻 Dažnos komandos</h2>
      <div class="cmd-group">
        <div class="cmd-title">DNS podėlio valymas (Windows):</div>
        <pre>ipconfig /flushdns</pre>
      </div>
      <div class="cmd-group">
        <div class="cmd-title">Tinklo maršruto tikrinimas:</div>
        <pre>tracert 1.1.1.1</pre>
      </div>
    </div>
  </div>

  <script>
    // Koordinatės (Lietuvos pajūris)
    const lat = 55.9175;
    const lng = 21.0686;

    fetch(`https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lng}&formatted=0`)
      .then(res => res.json())
      .then(data => {
        const sunrise = new Date(data.results.sunrise).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const sunset = new Date(data.results.sunset).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('sun').innerHTML = `Tekėjimas: <span style="color:#f2cc60">${sunrise}</span> &nbsp;|&nbsp; Leidimasis: <span style="color:#f2cc60">${sunset}</span>`;
      })
      .catch(() => {
        document.getElementById('sun').innerText = 'Nepavyko gauti duomenų';
      });
  </script>
</body>
</html>
